<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Study Planner" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="A free study planner for students: weekly timetable, assignment deadlines and a Pomodoro focus timer. No account needed." />
    <meta name="theme-color" content="#d0532f" />
    <title>Study Planner: Timetable, Deadlines & Focus Timer</title>
    <script>
      try {
        var t = localStorage.getItem('sp:theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
